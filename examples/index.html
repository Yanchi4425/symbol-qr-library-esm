      // Encryption password

        PRIVATE_KEY,
        NETWORK_TYPE,
        GENERATION_HASH,
        PASSWORD
      );
      
      // Create ContactQR from JSON
      const contactQR = ContactQR.fromJSON(

      // Create MnemonicQR from mnemonic phrase
